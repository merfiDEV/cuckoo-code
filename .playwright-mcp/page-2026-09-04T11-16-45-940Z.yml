                  - generic [ref=f3e783]: self.add_hook("TL_messages_setTyping")
                  - generic [ref=f3e784]: self.add_hook("TL_messages_setEncryptedTyping")
                  - generic [ref=f3e785]: self.add_hook("TL_account_updateStatus")
                  - generic [ref=f3e786]: self.add_on_send_message_hook()
              - paragraph [ref=f3e787]:
                - text: Every hook receives the
                - code [ref=f3e788]: account
                - text: it fired for, and it is often
                - strong [ref=f3e789]: not
                - text: the account selected in the UI — background accounts stay connected and keep firing hooks. Modifying the hooked object, as the examples below do, needs no special care. But the moment you send, request, or read something in response, use
                - code [ref=f3e790]: self.client(account)
                - text: or an explicit
                - code [ref=f3e791]: account=
                - text: ", or you will act on whichever account happens to be on screen. See"
                - link "Multi-account" [ref=f3e792] [cursor=pointer]:
                  - /url: /docs/multi-account
                - text: .
              - paragraph [ref=f3e793]:
                - text: Hook results are returned as
                - code [ref=f3e794]: HookResult
                - text: with a
                - code [ref=f3e795]: HookStrategy
                - text: .
              - figure [ref=f3e796]:
                - button "Copy Text" [ref=f3e797] [cursor=pointer]
                - code [ref=f3e805]:
                  - generic [ref=f3e806]: from typing import Any, List
                  - generic [ref=f3e808]: from base_plugin import BasePlugin, HookResult, HookStrategy
                  - generic [ref=f3e809]: from ui.settings import Switch
                  - generic [ref=f3e812]: TYPING_REQUESTS = ["TL_messages_setTyping", "TL_messages_setEncryptedTyping"]
                  - generic [ref=f3e815]: "class GhostModePlugin(BasePlugin):"
                  - generic [ref=f3e816]: "def on_plugin_load(self):"
                  - generic [ref=f3e817]: "for req_name in TYPING_REQUESTS:"
                  - generic [ref=f3e818]: self.add_hook(req_name)
                  - generic [ref=f3e820]: self.add_hook("TL_account_updateStatus")
                  - generic [ref=f3e822]: "def pre_request_hook(self, request_name: str, account: int, request: Any) -> HookResult:"
                  - generic [ref=f3e823]: "if request_name in TYPING_REQUESTS and self.get_setting(\"dont_send_typing\", True):"
                  - generic [ref=f3e824]: "self.log(f\"Blocking request: {request_name}\")"
                  - generic [ref=f3e825]: return HookResult(strategy=HookStrategy.CANCEL)
                  - generic [ref=f3e827]: "if request_name == \"TL_account_updateStatus\" and self.get_setting(\"force_offline\", True):"
                  - generic [ref=f3e828]: request.offline = True
                  - generic [ref=f3e829]: return HookResult(strategy=HookStrategy.MODIFY, request=request)
                  - generic [ref=f3e831]: return HookResult()
                  - generic [ref=f3e833]: "def post_request_hook(self, request_name: str, account: int, response: Any, error: Any) -> HookResult:"
                  - generic [ref=f3e834]: "if request_name == \"TL_messages_sendMessage\" and not error:"
                  - generic [ref=f3e835]: self.log("Successfully sent a message!")
                  - generic [ref=f3e836]: return HookResult()
                  - generic [ref=f3e838]: "def create_settings(self) -> List[Any]:"
                  - generic [ref=f3e839]: return [
                  - generic [ref=f3e840]: Switch(key="dont_send_typing", text="Don't send typing status", default=True),
                  - generic [ref=f3e841]: Switch(key="force_offline", text="Always appear offline", default=True),
                  - generic [ref=f3e842]: "]"
