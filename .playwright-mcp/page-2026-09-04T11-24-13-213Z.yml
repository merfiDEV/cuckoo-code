            - paragraph [ref=f10e333]: Helpers for queues, requests, notifications, controllers, fragments, and sending or editing messages.
            - generic [ref=f10e334]:
              - paragraph [ref=f10e335]: This module contains the higher-level helpers most plugins use when they need to interact with Telegram internals without dropping into raw Java code every time.
              - paragraph [ref=f10e336]: "Typical uses:"
              - list [ref=f10e337]:
                - listitem [ref=f10e338]: queueing work off the UI thread
                - listitem [ref=f10e339]: sending Telegram requests
                - listitem [ref=f10e340]: sending or editing messages and media
                - listitem [ref=f10e341]: reaching the current fragment or account controllers
                - listitem [ref=f10e342]:
                  - text: listening to
                  - code [ref=f10e343]: NotificationCenter
              - heading [level=2] [ref=f10e344]:
                - link "Queues (Background Threads)" [ref=f10e345] [cursor=pointer]:
