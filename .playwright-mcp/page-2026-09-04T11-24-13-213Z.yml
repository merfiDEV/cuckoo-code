                - img "Link to section" [ref=f10e346]
              - paragraph [ref=f10e349]:
                - text: Use
                - code [ref=f10e350]: run_on_queue(...)
                - text: "for work that should not block the UI thread: network requests, file I/O, heavy parsing, or long computations."
              - figure [ref=f10e351]:
                - button "Copy Text" [ref=f10e352] [cursor=pointer]
                - code [ref=f10e360]:
                  - generic [ref=f10e361]: import time
                  - generic [ref=f10e363]: from android_utils import log
                  - generic [ref=f10e364]: from client_utils import run_on_queue
                  - generic [ref=f10e367]: "def my_long_task(parameter: str):"
                  - generic [ref=f10e368]: "log(f\"Task started with: {parameter}\")"
                  - generic [ref=f10e369]: "time.sleep(5) # Simulate a long operation."
                  - generic [ref=f10e370]: "log(f\"Task finished for: {parameter}\")"
                  - generic [ref=f10e373]: "# Run on the default PLUGINS_QUEUE."
                  - generic [ref=f10e374]: "run_on_queue(lambda: my_long_task(\"some_data\"))"
              - paragraph [ref=f10e375]: "You can target a specific queue and add a delay in milliseconds:"
              - figure [ref=f10e376]:
                - button "Copy Text" [ref=f10e377] [cursor=pointer]
                - code [ref=f10e385]:
                  - generic [ref=f10e386]: from client_utils import GLOBAL_QUEUE, run_on_queue
                  - generic [ref=f10e389]: "# Run on GLOBAL_QUEUE after a 2.5 second delay."
                  - generic [ref=f10e390]: "run_on_queue(lambda: my_long_task(\"other_data\"), GLOBAL_QUEUE, 2500)"
              - paragraph [ref=f10e391]: "Available queue-name constants:"
