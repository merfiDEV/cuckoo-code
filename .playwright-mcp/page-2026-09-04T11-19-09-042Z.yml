                - code [ref=f5e699]:
                  - generic [ref=f5e700]: ActionBarClass = find_class("org.telegram.ui.ActionBar.ActionBar")
                  - generic [ref=f5e701]: CharSequenceClass = find_class("java.lang.CharSequence")
                  - generic [ref=f5e703]: set_title_method = ActionBarClass.getDeclaredMethod("setTitle", CharSequenceClass)
