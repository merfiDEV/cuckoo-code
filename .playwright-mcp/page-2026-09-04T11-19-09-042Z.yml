                - text: ", the original method is skipped."
              - figure [ref=f5e456]:
                - button "Copy Text" [ref=f5e457] [cursor=pointer]
                - code [ref=f5e465]:
                  - generic [ref=f5e466]: "def before_hooked_method(self, param):"
                  - generic [ref=f5e467]: "if param.args[0] == \"blocked\":"
                  - generic [ref=f5e468]: param.setResult(None)
              - heading [level=2] [ref=f5e469]:
                - link "Filters" [ref=f5e470] [cursor=pointer]:
                  - /url: "#filters"
                - img "Link to section" [ref=f5e471]
              - paragraph [ref=f5e474]: Filters decide whether your hook callback should run at all.
              - paragraph [ref=f5e475]: "You can use them in two styles:"
              - list [ref=f5e476]:
