          - article [ref=f5e331]:
            - heading "Xposed Method Hooking" [level=1] [ref=f5e332]
            - paragraph [ref=f5e333]: Hook Java methods and constructors from Python plugins using MethodHook, MethodReplacement, BaseHook, and filters.
            - generic [ref=f5e334]:
              - heading [level=2] [ref=f5e335]:
                - link "Introduction" [ref=f5e336] [cursor=pointer]:
                  - /url: "#introduction"
                - img "Link to section" [ref=f5e337]
              - paragraph [ref=f5e340]: Xposed-style method hooking lets your plugin intercept method calls inside the app, modify arguments, inspect or replace return values, or skip the original implementation entirely.
              - paragraph [ref=f5e341]: This is one of the most powerful parts of the plugin SDK, and also one of the easiest to misuse, so it is worth being explicit about the available styles.
              - heading [level=2] [ref=f5e342]:
                - link "Hook Handler Styles" [ref=f5e343] [cursor=pointer]:
                  - /url: "#hook-handler-styles"
                - img "Link to section" [ref=f5e344]
              - paragraph [ref=f5e347]: You can provide hook logic in three ways.
              - heading [level=3] [ref=f5e348]:
                - link [ref=f5e349] [cursor=pointer]:
                  - /url: "#1-methodhook"
                  - text: "1."
                  - code [ref=f5e350]: MethodHook
                - img "Link to section" [ref=f5e351]
              - paragraph [ref=f5e354]:
                - text: Use
                - code [ref=f5e355]: MethodHook
                - text: when you want
                - code [ref=f5e356]: before_hooked_method(...)
                - text: and/or
                - code [ref=f5e357]: after_hooked_method(...)
                - text: .
              - figure [ref=f5e358]:
                - button "Copy Text" [ref=f5e359] [cursor=pointer]
                - code [ref=f5e367]:
                  - generic [ref=f5e368]: from base_plugin import MethodHook
                  - generic [ref=f5e371]: "class TitleLoggerHook(MethodHook):"
                  - generic [ref=f5e372]: "def before_hooked_method(self, param):"
                  - generic [ref=f5e373]: title = param.args[0]
                  - generic [ref=f5e374]: "print(f\"ActionBar title is about to become: {title}\")"
                  - generic [ref=f5e376]: "def after_hooked_method(self, param):"
                  - generic [ref=f5e377]: "print(f\"Method finished with result: {param.getResult()}\")"
              - heading [level=3] [ref=f5e378]:
                - link [ref=f5e379] [cursor=pointer]:
                  - /url: "#2-methodreplacement"
                  - text: "2."
                  - code [ref=f5e380]: MethodReplacement
                - img "Link to section" [ref=f5e381]
              - paragraph [ref=f5e384]:
                - text: Use
                - code [ref=f5e385]: MethodReplacement
                - text: when you want to fully replace the original Java method.
              - figure [ref=f5e386]:
                - button "Copy Text" [ref=f5e387] [cursor=pointer]
                - code [ref=f5e395]:
                  - generic [ref=f5e396]: from base_plugin import MethodReplacement
                  - generic [ref=f5e399]: "class TitleReplacer(MethodReplacement):"
                  - generic [ref=f5e400]: "def replace_hooked_method(self, param):"
                  - generic [ref=f5e401]: print("Original method was replaced.")
                  - generic [ref=f5e402]: return None
              - heading [level=3] [ref=f5e403]:
                - link [ref=f5e404] [cursor=pointer]:
                  - /url: "#3-functional-hooks-or-basehook"
                  - text: 3. Functional hooks or
                  - code [ref=f5e405]: BaseHook
                - img "Link to section" [ref=f5e406]
              - paragraph [ref=f5e409]:
                - text: For simpler cases, you can skip creating a full class and pass
                - code [ref=f5e410]: before=
                - text: and/or
                - code [ref=f5e411]: after=
                - text: "directly:"
              - figure [ref=f5e412]:
                - button "Copy Text" [ref=f5e413] [cursor=pointer]
                - code [ref=f5e421]:
                  - generic [ref=f5e422]: self.hook_method(
                  - generic [ref=f5e423]: some_method,
                  - generic [ref=f5e424]: "before=lambda param: self.log(\"Method is about to run!\"),"
                  - generic [ref=f5e425]: "after=lambda param: self.log(f\"Method finished with result: {param.getResult()}\"),"
                  - generic [ref=f5e426]: )
              - paragraph [ref=f5e427]:
                - text: Internally the SDK wraps that style into
                - code [ref=f5e428]: BaseHook
                - text: ", which is a small helper subclass of"
                - code [ref=f5e429]: MethodHook
                - text: .
              - heading [level=2] [ref=f5e430]:
                - link [ref=f5e431] [cursor=pointer]:
                  - /url: "#the-param-object"
                  - text: The
                  - code [ref=f5e432]: param
                  - text: Object
                - img "Link to section" [ref=f5e433]
              - paragraph [ref=f5e436]:
                - text: All hook callbacks receive
                - code [ref=f5e437]: de.robv.android.xposed.XC_MethodHook.MethodHookParam
                - text: .
              - paragraph [ref=f5e438]: "The most useful fields and methods are:"
              - list [ref=f5e439]:
                - listitem [ref=f5e440]:
                  - code [ref=f5e441]: param.thisObject
