                - listitem [ref=f5e479]:
                  - code [ref=f5e480]: before_filters=[...]
                  - text: and
                  - code [ref=f5e481]: after_filters=[...]
                  - text: for functional hooks
              - figure [ref=f5e482]:
                - button "Copy Text" [ref=f5e483] [cursor=pointer]
                - code [ref=f5e491]:
                  - generic [ref=f5e492]: from base_plugin import HookFilter
                  - generic [ref=f5e495]: self.hook_method(
                  - generic [ref=f5e496]: some_method,
                  - generic [ref=f5e497]: "before=lambda p: self.log(\"Arg 0 is null!\"),"
                  - generic [ref=f5e498]: before_filters=[HookFilter.ArgumentIsNull(0)],
                  - generic [ref=f5e499]: )
              - heading [level=3] [ref=f5e500]:
                - link [ref=f5e501] [cursor=pointer]:
                  - /url: "#available-hookfilter-helpers"
                  - text: Available
                  - code [ref=f5e502]: HookFilter
                  - text: helpers
                - img "Link to section" [ref=f5e503]
              - list [ref=f5e506]:
                - listitem [ref=f5e507]:
                  - code [ref=f5e508]: HookFilter.RESULT_IS_NULL
                - listitem [ref=f5e509]:
                  - code [ref=f5e510]: HookFilter.RESULT_IS_TRUE
                - listitem [ref=f5e511]:
                  - code [ref=f5e512]: HookFilter.RESULT_IS_FALSE
                - listitem [ref=f5e513]:
                  - code [ref=f5e514]: HookFilter.RESULT_NOT_NULL
                - listitem [ref=f5e515]:
                  - code [ref=f5e516]: HookFilter.ResultIsInstanceOf(clazz)
                - listitem [ref=f5e517]:
                  - code [ref=f5e518]: HookFilter.ResultEqual(value)
                - listitem [ref=f5e519]:
                  - code [ref=f5e520]: HookFilter.ResultNotEqual(value)
                - listitem [ref=f5e521]:
                  - code [ref=f5e522]: HookFilter.ArgumentIsNull(index)
                - listitem [ref=f5e523]:
