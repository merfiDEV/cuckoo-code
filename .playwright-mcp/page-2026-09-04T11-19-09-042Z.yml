              - heading [level=3] [ref=f5e599]:
                - link "1. Find the target method or constructor" [ref=f5e600] [cursor=pointer]:
                  - /url: "#1-find-the-target-method-or-constructor"
                - img "Link to section" [ref=f5e601]
              - paragraph [ref=f5e604]:
                - text: You usually start with
                - code [ref=f5e605]: find_class(...)
                - text: ", then call Java reflection directly on the returned"
                - code [ref=f5e606]: Class
                - text: .
              - figure [ref=f5e607]:
                - button "Copy Text" [ref=f5e608] [cursor=pointer]
                - code [ref=f5e616]:
                  - generic [ref=f5e617]: from hook_utils import find_class
                  - generic [ref=f5e620]: ActionBarClass = find_class("org.telegram.ui.ActionBar.ActionBar")
                  - generic [ref=f5e621]: "if not ActionBarClass:"
                  - generic [ref=f5e622]: self.log("ActionBar class not found!")
                  - generic [ref=f5e623]: return
                  - generic [ref=f5e626]: "# Example method: public void setTitle(CharSequence title)"
                  - generic [ref=f5e627]: CharSequenceClass = find_class("java.lang.CharSequence")
                  - generic [ref=f5e628]: set_title_method = ActionBarClass.getDeclaredMethod("setTitle", CharSequenceClass)
                  - generic [ref=f5e629]: set_title_method.setAccessible(True)
                  - generic [ref=f5e632]: "# Example constructor: public ActionBar(Context context)"
                  - generic [ref=f5e633]: ContextClass = find_class("android.content.Context")
                  - generic [ref=f5e634]: action_bar_constructor = ActionBarClass.getDeclaredConstructor(ContextClass)
                  - generic [ref=f5e635]: action_bar_constructor.setAccessible(True)
              - generic [ref=f5e639]:
                - paragraph [ref=f5e640]: "Do not call `getClass()` on the `Class` object"
