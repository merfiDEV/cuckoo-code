                - listitem [ref=f6e2372]:
                  - text: the base class is not
                  - code [ref=f6e2373]: final
                - listitem [ref=f6e2374]: constructor signatures match a real constructor
                - listitem [ref=f6e2375]: overload signatures match real Java method argument types
