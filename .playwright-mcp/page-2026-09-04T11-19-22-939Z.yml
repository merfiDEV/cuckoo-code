              - paragraph [ref=f6e2304]: "Use class proxy when:"
              - list [ref=f6e2305]:
                - listitem [ref=f6e2306]: a Java API requires subclassing instead of interface proxying
                - listitem [ref=f6e2307]:
                  - text: you need parent-method calls with
                  - code [ref=f6e2308]: super()
                - listitem [ref=f6e2309]: you need overload-specific behavior
                - listitem [ref=f6e2310]: you want Java fields or extra Java methods on the generated object
              - paragraph [ref=f6e2311]:
                - text: Do not use it when a simple
                - code [ref=f6e2312]: dynamic_proxy(...)
                - text: is enough for an interface.
              - paragraph [ref=f6e2313]: Also make sure the base Java class is actually subclassable. Final classes cannot be used as a proxy base class.
              - heading [level=2] [ref=f6e2314]:
                - link "Troubleshooting" [ref=f6e2315] [cursor=pointer]:
                  - /url: "#troubleshooting"
                - img "Link to section" [ref=f6e2316]
              - heading [level=3] [ref=f6e2319]:
                - link [ref=f6e2320] [cursor=pointer]:
                  - /url: "#super-does-not-work"
                  - code [ref=f6e2321]: super()
                  - text: does not work
                - img "Link to section" [ref=f6e2322]
              - paragraph [ref=f6e2325]: "Check that:"
              - list [ref=f6e2326]:
                - listitem [ref=f6e2327]:
                  - text: the method is declared with
                  - code [ref=f6e2328]: "@joverride(...)"
                  - text: or
                  - code [ref=f6e2329]: "@joverload(...)"
                - listitem [ref=f6e2330]: the method name or signature matches the Java parent method
              - heading [level=3] [ref=f6e2331]:
                - link "My overload is not called" [ref=f6e2332] [cursor=pointer]:
                  - /url: "#my-overload-is-not-called"
                - img "Link to section" [ref=f6e2333]
              - paragraph [ref=f6e2336]: "Check that:"
              - list [ref=f6e2337]:
                - listitem [ref=f6e2338]: the Java name is correct
                - listitem [ref=f6e2339]: the argument types match the real Java signature exactly
                - listitem [ref=f6e2340]:
                  - text: primitive types use primitive names such as
                  - code [ref=f6e2341]: "\"int\""
                  - text: instead of wrapper classes
              - heading [level=3] [ref=f6e2342]:
                - link "Constructor hook is not called" [ref=f6e2343] [cursor=pointer]:
                  - /url: "#constructor-hook-is-not-called"
                - img "Link to section" [ref=f6e2344]
              - paragraph [ref=f6e2347]: "Check that:"
              - list [ref=f6e2348]:
                - listitem [ref=f6e2349]:
                  - code [ref=f6e2350]: "@jpreconstructor(...)"
                  - text: or
                  - code [ref=f6e2351]: "@jconstructor(...)"
                  - text: uses the correct constructor signature
                - listitem [ref=f6e2352]: for wildcard constructor hooks, your annotations are either complete or you intentionally omitted the signature
              - heading [level=3] [ref=f6e2353]:
                - link [ref=f6e2354] [cursor=pointer]:
                  - /url: "#field-value-is-always-none"
                  - text: Field value is always
                  - code [ref=f6e2355]: None
                - img "Link to section" [ref=f6e2356]
              - paragraph [ref=f6e2359]: "Check that:"
              - list [ref=f6e2360]:
                - listitem [ref=f6e2361]:
                  - text: the field was declared with
                  - code [ref=f6e2362]: jfield(...)
                - listitem [ref=f6e2363]: the field type is valid
                - listitem [ref=f6e2364]: the default value is compatible with the declared Java type
              - heading [level=3] [ref=f6e2365]:
