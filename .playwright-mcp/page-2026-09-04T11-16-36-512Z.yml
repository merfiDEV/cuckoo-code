                - link "Telegram" [ref=f2e492] [cursor=pointer]:
                  - /url: https://telegram.org
                - text: is a messaging app with a focus on speed and security. It’s superfast, simple and free. This repo contains the official source code for
                - link "Telegram App for Android" [ref=f2e493] [cursor=pointer]:
                  - /url: https://play.google.com/store/apps/details?id=org.telegram.messenger
                - text: .
              - generic [ref=f2e494]:
                - heading "Creating your Telegram Application" [level=2] [ref=f2e495]
                - 'link "Permalink: Creating your Telegram Application" [ref=f2e496] [cursor=pointer]':
                  - /url: "#creating-your-telegram-application"
              - paragraph [ref=f2e499]:
                - text: We welcome all developers to use our API and source code to create applications on our platform. There are several things we require from
                - strong [ref=f2e500]: all developers
                - text: for the moment.
              - list [ref=f2e501]:
                - listitem [ref=f2e502]:
                  - link [ref=f2e503] [cursor=pointer]:
                    - /url: https://core.telegram.org/api/obtaining_api_id
                    - strong [ref=f2e504]: Obtain your own api_id
                  - text: for your application.
                - listitem [ref=f2e505]:
                  - text: Please
                  - strong [ref=f2e506]: do not
                  - text: use the name Telegram for your app — or make sure your users understand that it is unofficial.
                - listitem [ref=f2e507]:
                  - text: Kindly
                  - strong [ref=f2e508]: do not
                  - text: use our standard logo (white paper plane in a blue circle) as your app's logo.
                - listitem [ref=f2e509]:
                  - text: Please study our
                  - link [ref=f2e510] [cursor=pointer]:
                    - /url: https://core.telegram.org/mtproto/security_guidelines
                    - strong [ref=f2e511]: security guidelines
                  - text: and take good care of your users' data and privacy.
                - listitem [ref=f2e512]:
                  - text: Please remember to publish
                  - strong [ref=f2e513]: your
                  - text: code too in order to comply with the licences.
              - generic [ref=f2e514]:
                - heading "API, Protocol documentation" [level=3] [ref=f2e515]
                - 'link "Permalink: API, Protocol documentation" [ref=f2e516] [cursor=pointer]':
