              - paragraph [ref=f2e528]:
                - strong [ref=f2e529]: Note
                - text: ": In order to support"
                - link "reproducible builds" [ref=f2e530] [cursor=pointer]:
                  - /url: https://core.telegram.org/reproducible-builds
                - text: ", this repo contains dummy release.keystore, google-services.json and filled variables inside BuildVars.java. Before publishing your own APKs please make sure to replace all these files with your own."
              - paragraph [ref=f2e531]: You will require Android Studio 2025.1.4, Android NDK 27.2.12479018 and Android SDK 36.
              - list [ref=f2e532]:
                - listitem [ref=f2e533]:
                  - text: "Clone the Telegram source code with its submodules:"
                  - generic [ref=f2e534]:
                    - generic [ref=f2e535]: git clone --recursive --shallow-submodules https://github.com/DrKLO/Telegram.git Telegram
                    - button "Copy code to clipboard" [ref=f2e537] [cursor=pointer]
                  - text: In case you forgot the
                  - code [ref=f2e541]: "--recursive"
                  - text: flag, change to the
                  - code [ref=f2e542]: Telegram
                  - text: "directory and run:"
                  - generic [ref=f2e543]:
                    - generic [ref=f2e544]: git submodule init && git submodule update --init --recursive --depth=1
                    - button "Copy code to clipboard" [ref=f2e546] [cursor=pointer]
                - listitem [ref=f2e550]: Copy your release.keystore into TMessagesProj/config
                - listitem [ref=f2e551]: Fill out RELEASE_KEY_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_STORE_PASSWORD in gradle.properties to access your release.keystore
                - listitem [ref=f2e552]:
                  - text: Go to
                  - link "https://console.firebase.google.com/" [ref=f2e553] [cursor=pointer]:
                    - /url: https://console.firebase.google.com/
                  - text: ", create two android apps with application IDs org.telegram.messenger and org.telegram.messenger.beta, turn on firebase messaging and download google-services.json, which should be copied to the same folder as TMessagesProj."
                - listitem [ref=f2e554]: Open the project in the Studio (note that it should be opened, NOT imported).
                - listitem [ref=f2e555]: Fill out values in TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java – there’s a link for each of the variables showing where and which data to obtain.
                - listitem [ref=f2e556]: You are ready to compile Telegram.
