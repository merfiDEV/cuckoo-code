          - article [ref=f8e331]:
            - heading "Xposed Method Hooking" [level=1] [ref=f8e332]
            - paragraph [ref=f8e333]: Hook Java methods and constructors from Python plugins using MethodHook, MethodReplacement, BaseHook, and filters.
            - generic [ref=f8e334]:
              - heading [level=2] [ref=f8e335]:
                - link "Introduction" [ref=f8e336] [cursor=pointer]:
                  - /url: "#introduction"
                - img "Link to section" [ref=f8e337]
              - paragraph [ref=f8e340]: Xposed-style method hooking lets your plugin intercept method calls inside the app, modify arguments, inspect or replace return values, or skip the original implementation entirely.
              - paragraph [ref=f8e341]: This is one of the most powerful parts of the plugin SDK, and also one of the easiest to misuse, so it is worth being explicit about the available styles.
              - heading [level=2] [ref=f8e342]:
                - link "Hook Handler Styles" [ref=f8e343] [cursor=pointer]:
                  - /url: "#hook-handler-styles"
                - img "Link to section" [ref=f8e344]
              - paragraph [ref=f8e347]: You can provide hook logic in three ways.
              - heading [level=3] [ref=f8e348]:
                - link [ref=f8e349] [cursor=pointer]:
                  - /url: "#1-methodhook"
                  - text: "1."
                  - code [ref=f8e350]: MethodHook
                - img "Link to section" [ref=f8e351]
              - paragraph [ref=f8e354]:
                - text: Use
                - code [ref=f8e355]: MethodHook
                - text: when you want
                - code [ref=f8e356]: before_hooked_method(...)
                - text: and/or
                - code [ref=f8e357]: after_hooked_method(...)
                - text: .
              - figure [ref=f8e358]:
                - button "Copy Text" [ref=f8e359] [cursor=pointer]
                - code [ref=f8e367]:
                  - generic [ref=f8e368]: from base_plugin import MethodHook
                  - generic [ref=f8e371]: "class TitleLoggerHook(MethodHook):"
                  - generic [ref=f8e372]: "def before_hooked_method(self, param):"
                  - generic [ref=f8e373]: title = param.args[0]
                  - generic [ref=f8e374]: "print(f\"ActionBar title is about to become: {title}\")"
                  - generic [ref=f8e376]: "def after_hooked_method(self, param):"
                  - generic [ref=f8e377]: "print(f\"Method finished with result: {param.getResult()}\")"
              - heading [level=3] [ref=f8e378]:
                - link [ref=f8e379] [cursor=pointer]:
                  - /url: "#2-methodreplacement"
                  - text: "2."
                  - code [ref=f8e380]: MethodReplacement
                - img "Link to section" [ref=f8e381]
              - paragraph [ref=f8e384]:
                - text: Use
                - code [ref=f8e385]: MethodReplacement
                - text: when you want to fully replace the original Java method.
              - figure [ref=f8e386]:
                - button "Copy Text" [ref=f8e387] [cursor=pointer]
                - code [ref=f8e395]:
                  - generic [ref=f8e396]: from base_plugin import MethodReplacement
                  - generic [ref=f8e399]: "class TitleReplacer(MethodReplacement):"
                  - generic [ref=f8e400]: "def replace_hooked_method(self, param):"
                  - generic [ref=f8e401]: print("Original method was replaced.")
                  - generic [ref=f8e402]: return None
              - heading [level=3] [ref=f8e403]:
                - link [ref=f8e404] [cursor=pointer]:
                  - /url: "#3-functional-hooks-or-basehook"
                  - text: 3. Functional hooks or
                  - code [ref=f8e405]: BaseHook
                - img "Link to section" [ref=f8e406]
              - paragraph [ref=f8e409]:
                - text: For simpler cases, you can skip creating a full class and pass
                - code [ref=f8e410]: before=
                - text: and/or
                - code [ref=f8e411]: after=
                - text: "directly:"
              - figure [ref=f8e412]:
                - button "Copy Text" [ref=f8e413] [cursor=pointer]
                - code [ref=f8e421]:
                  - generic [ref=f8e422]: self.hook_method(
                  - generic [ref=f8e423]: some_method,
                  - generic [ref=f8e424]: "before=lambda param: self.log(\"Method is about to run!\"),"
                  - generic [ref=f8e425]: "after=lambda param: self.log(f\"Method finished with result: {param.getResult()}\"),"
                  - generic [ref=f8e426]: )
              - paragraph [ref=f8e427]:
                - text: Internally the SDK wraps that style into
