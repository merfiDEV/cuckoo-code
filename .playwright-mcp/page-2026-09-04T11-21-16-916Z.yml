              - heading [level=3] [ref=f8e599]:
                - link "1. Find the target method or constructor" [ref=f8e600] [cursor=pointer]:
                  - /url: "#1-find-the-target-method-or-constructor"
                - img "Link to section" [ref=f8e601]
              - paragraph [ref=f8e604]:
                - text: You usually start with
                - code [ref=f8e605]: find_class(...)
                - text: ", then call Java reflection directly on the returned"
                - code [ref=f8e606]: Class
                - text: .
              - figure [ref=f8e607]:
                - button "Copy Text" [ref=f8e608] [cursor=pointer]
                - code [ref=f8e616]:
                  - generic [ref=f8e617]: from hook_utils import find_class
                  - generic [ref=f8e620]: ActionBarClass = find_class("org.telegram.ui.ActionBar.ActionBar")
                  - generic [ref=f8e621]: "if not ActionBarClass:"
