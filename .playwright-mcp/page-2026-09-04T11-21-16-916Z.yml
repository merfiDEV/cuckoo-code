              - heading [level=2] [ref=f8e469]:
                - link "Filters" [ref=f8e470] [cursor=pointer]:
                  - /url: "#filters"
                - img "Link to section" [ref=f8e471]
              - paragraph [ref=f8e474]: Filters decide whether your hook callback should run at all.
              - paragraph [ref=f8e475]: "You can use them in two styles:"
