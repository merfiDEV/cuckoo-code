                  - generic [ref=f8e496]: some_method,
                  - generic [ref=f8e497]: "before=lambda p: self.log(\"Arg 0 is null!\"),"
                  - generic [ref=f8e498]: before_filters=[HookFilter.ArgumentIsNull(0)],
                  - generic [ref=f8e499]: )
              - heading [level=3] [ref=f8e500]:
                - link [ref=f8e501] [cursor=pointer]:
                  - /url: "#available-hookfilter-helpers"
                  - text: Available
                  - code [ref=f8e502]: HookFilter
                  - text: helpers
                - img "Link to section" [ref=f8e503]
              - list [ref=f8e506]:
                - listitem [ref=f8e507]:
                  - code [ref=f8e508]: HookFilter.RESULT_IS_NULL
                - listitem [ref=f8e509]:
