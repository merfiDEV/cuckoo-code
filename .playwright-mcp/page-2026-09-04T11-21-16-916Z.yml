                  - generic [ref=f8e628]: set_title_method = ActionBarClass.getDeclaredMethod("setTitle", CharSequenceClass)
                  - generic [ref=f8e629]: set_title_method.setAccessible(True)
                  - generic [ref=f8e632]: "# Example constructor: public ActionBar(Context context)"
