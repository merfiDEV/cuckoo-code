              - paragraph [ref=f9e454]: "The wrapped Python callable is expected to return a boolean:"
              - list [ref=f9e455]:
                - listitem [ref=f9e456]:
                  - code [ref=f9e457]: "True"
                  - text: ": consume the long-click event"
                - listitem [ref=f9e458]:
                  - code [ref=f9e459]: "False"
                  - text: ": let Android continue processing it"
