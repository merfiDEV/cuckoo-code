          - article [ref=f9e331]:
            - heading "Android Utilities" [level=1] [ref=f9e332]
            - paragraph [ref=f9e333]: Helpers for UI-thread work, Android listeners, logging, clipboard access, and Java Runnable wrappers.
            - generic [ref=f9e334]:
              - paragraph [ref=f9e335]: This module provides small but very frequently used helpers for Android-side work inside plugins.
              - paragraph [ref=f9e336]: "Most of the time you will use it for three things:"
              - list [ref=f9e337]:
                - listitem [ref=f9e338]: running code on the UI thread
                - listitem [ref=f9e339]: attaching simple click listeners
                - listitem [ref=f9e340]: logging and quick debugging
              - heading [level=2] [ref=f9e341]:
                - link "Wrappers for Java Interfaces" [ref=f9e342] [cursor=pointer]:
                  - /url: "#wrappers-for-java-interfaces"
                - img "Link to section" [ref=f9e343]
              - paragraph [ref=f9e346]: These wrappers let you pass Python callables into Android APIs that expect Java listener objects.
              - heading [level=3] [ref=f9e347]:
                - link "R (Runnable Proxy)" [ref=f9e348] [cursor=pointer]:
                  - /url: "#r-runnable-proxy"
                - img "Link to section" [ref=f9e349]
              - paragraph [ref=f9e352]:
                - code [ref=f9e353]: R(fn)
                - text: creates a real Java
                - code [ref=f9e354]: Runnable
                - text: backed by your Python callable.
              - paragraph [ref=f9e355]:
                - text: This is useful when some Android or Telegram API expects a
                - code [ref=f9e356]: java.lang.Runnable
                - text: instance, for example
                - code [ref=f9e357]: view.post(...)
                - text: ", delayed callbacks, or various internal helper methods."
              - figure [ref=f9e358]:
                - button "Copy Text" [ref=f9e359] [cursor=pointer]
                - code [ref=f9e367]:
                  - generic [ref=f9e368]: from android_utils import R, log
                  - generic [ref=f9e371]: "def my_task():"
                  - generic [ref=f9e372]: log("Runnable task executed.")
                  - generic [ref=f9e375]: "# Create a Java Runnable instance backed by Python."
                  - generic [ref=f9e376]: runnable_instance = R(my_task)
                  - generic [ref=f9e378]: "# Example usage with an API that expects Runnable."
                  - generic [ref=f9e379]: some_view = ...
                  - generic [ref=f9e380]: some_view.post(runnable_instance)
              - generic [ref=f9e384]:
                - paragraph [ref=f9e385]: "`run_on_ui_thread` already wraps your callable"
                - paragraph [ref=f9e387]:
                  - code [ref=f9e388]: run_on_ui_thread(...)
                  - text: accepts a normal Python callable and internally converts it to a Java
                  - code [ref=f9e389]: Runnable
                  - text: for you. Use
                  - code [ref=f9e390]: R(...)
                  - text: when some other API explicitly requires a
                  - code [ref=f9e391]: Runnable
                  - text: object.
              - heading [level=3] [ref=f9e392]:
                - link "OnClickListener" [ref=f9e393] [cursor=pointer]:
                  - /url: "#onclicklistener"
                - img "Link to section" [ref=f9e394]
              - paragraph [ref=f9e397]:
                - code [ref=f9e398]: OnClickListener(fn)
                - text: is a convenience wrapper for
                - code [ref=f9e399]: android.view.View.OnClickListener
                - text: .
              - figure [ref=f9e400]:
                - button "Copy Text" [ref=f9e401] [cursor=pointer]
                - code [ref=f9e409]:
                  - generic [ref=f9e410]: from android_utils import OnClickListener, log
                  - generic [ref=f9e411]: from android.view import View
                  - generic [ref=f9e414]: "def handle_button_click(view: View):"
                  - generic [ref=f9e415]: "log(f\"Button {view.getId()} was clicked.\")"
                  - generic [ref=f9e418]: button = ...
                  - generic [ref=f9e419]: button.setOnClickListener(OnClickListener(handle_button_click))
              - paragraph [ref=f9e420]:
                - text: Your callable receives the clicked
                - code [ref=f9e421]: View
                - text: as its only argument.
              - heading [level=3] [ref=f9e422]:
                - link "OnLongClickListener" [ref=f9e423] [cursor=pointer]:
                  - /url: "#onlongclicklistener"
                - img "Link to section" [ref=f9e424]
              - paragraph [ref=f9e427]:
                - code [ref=f9e428]: OnLongClickListener(fn)
                - text: is a convenience wrapper for
                - code [ref=f9e429]: android.view.View.OnLongClickListener
                - text: .
              - figure [ref=f9e430]:
                - button "Copy Text" [ref=f9e431] [cursor=pointer]
                - code [ref=f9e439]:
                  - generic [ref=f9e440]: from android_utils import OnLongClickListener, log
                  - generic [ref=f9e441]: from android.view import View
                  - generic [ref=f9e444]: "def handle_button_long_click(view: View):"
                  - generic [ref=f9e445]: "log(f\"Button {view.getId()} was long-clicked.\")"
                  - generic [ref=f9e446]: return True
                  - generic [ref=f9e449]: button = ...
