            - heading "Development Server" [level=1] [ref=f12e332]
            - paragraph [ref=f12e333]: Connect desktop tooling to exteraGram for plugin updates, reloads, and remote debugging.
            - generic [ref=f12e334]:
              - heading [level=1] [ref=f12e335]:
                - link "Development server" [ref=f12e336] [cursor=pointer]:
                  - /url: "#development-server"
                - img "Link to section" [ref=f12e337]
              - paragraph [ref=f12e340]: The SDK includes a small TCP development server for desktop tooling. It can inspect and reload regular Python plugins, and Elyx extends it with multi-file synchronization.
              - paragraph [ref=f12e341]: "The default endpoint is:"
              - figure [ref=f12e342]:
                - button "Copy Text" [ref=f12e343] [cursor=pointer]
                - code [ref=f12e351]:
                  - generic [ref=f12e352]: 127.0.0.1:42690
              - paragraph [ref=f12e353]: "Because the server binds to the phone's loopback interface, connect through ADB:"
              - figure [ref=f12e354]:
                - button "Copy Text" [ref=f12e355] [cursor=pointer]
                - code [ref=f12e363]:
                  - generic [ref=f12e364]: adb devices
                  - generic [ref=f12e365]: adb forward tcp:42690 tcp:42690
              - paragraph [ref=f12e366]:
                - text: Then desktop clients connect to
                - code [ref=f12e367]: 127.0.0.1:42690
                - text: .
              - generic [ref=f12e371]:
                - paragraph [ref=f12e372]: Development use only
                - paragraph [ref=f12e374]: Enable the server only while developing. Its protocol can install, rewrite, enable, disable, reload, and delete plugin code.
              - heading [level=2] [ref=f12e375]:
